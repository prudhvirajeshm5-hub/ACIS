{% load static %}<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Password Reset — ACIS</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/app.css' %}"></head>
<body><div class="login-wrap"><div class="login-card">
<div class="login-mark"><div class="sq">A</div><div class="name">ACIS</div></div>
{% if form %}
<form method="post">{% csrf_token %}
  {% for field in form %}<div class="field"><label>{{ field.label }}</label>{{ field }}</div>{% endfor %}
  <button class="btn btn-primary" style="width:100%;" type="submit">Continue</button>
</form>
{% else %}
<p class="login-sub">If an account with that email exists, instructions have been sent. You can now close this page.</p>
<a class="btn btn-ghost" href="{% url 'accounts:login' %}">Back to sign in</a>
{% endif %}
</div></div></body></html>
